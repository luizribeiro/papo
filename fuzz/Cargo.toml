[package]
name = "papo-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
papo-core = { path = "../crates/papo-core" }
papo-proto = { path = "../crates/papo-proto" }
papo = { path = "../crates/papo", default-features = false }
web-time = "1"

[[bin]]
name = "line"
path = "fuzz_targets/line.rs"
test = false
doc = false
bench = false

[[bin]]
name = "construction"
path = "fuzz_targets/construction.rs"
test = false
doc = false
bench = false

[[bin]]
name = "outgoing_text"
path = "fuzz_targets/outgoing_text.rs"
test = false
doc = false
bench = false

[[bin]]
name = "server_url"
path = "fuzz_targets/server_url.rs"
test = false
doc = false
bench = false

[[bin]]
name = "session_events"
path = "fuzz_targets/session_events.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
