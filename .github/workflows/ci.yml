---
name: CI

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      # Full debug info for every flake check can fill the runner disk.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Free runner disk space
        run: >-
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          /opt/hostedtoolcache/CodeQL
      - uses: ./.github/actions/setup-nix
      - name: Reject merge commits
        env:
          BASE_COMMIT: >-
            ${{ github.event.pull_request.base.sha || github.event.before }}
        run: scripts/check-no-merge-commits "$BASE_COMMIT"
      - name: Check flake
        # GitHub-hosted runners do not provide supported nested virtualization.
        run: |
          nix flake check -L --no-build
          mapfile -t checks < <(
            nix eval --json '.#checks.x86_64-linux' \
              --apply 'checks: builtins.attrNames (
                builtins.removeAttrs checks [ "webpush-vm" ]
              )' \
              | jq -r '.[] | ".#checks.x86_64-linux." + .'
          )
          nix build -L --no-link "${checks[@]}"
      - name: Run pre-commit hooks
        run: nix develop -c pre-commit run --all-files --show-diff-on-failure
      - name: Run pre-push hooks
        env:
          SKIP: flake-check
        run: >-
          nix develop -c pre-commit run --all-files --hook-stage pre-push
          --show-diff-on-failure
      - name: Check dependency advisories
        run: nix develop -c cargo deny check advisories
