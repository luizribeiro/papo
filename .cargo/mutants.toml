exclude_globs = [
  # Native mutation tests cannot compile browser-only platform files; the browser suite covers them.
  'crates/papo/src/**/*_browser.rs',
  'crates/papo/src/**/browser.rs',
  'crates/papo/src/transport/websocket_browser/**/*.rs',
]

exclude_re = [
  # These cfg(test) helpers contain assertions; replacing them removes the test itself.
  'replace check_action with \(\)$',
  'replace check_chat with \(\)$',
  'replace tests::assert_event_times with \(\)$',
  # A stable build already returns `None`, so this replacement is equivalent.
  'replace Config::selected_bouncer_network -> Option<&str> with None$',
  # Typing changes have no message identifier, so both empty-vector forms are equivalent.
  'replace <impl ReplyReference for TypingChanged>::msgids -> Vec<MessageId> with vec!\[\]$',
  # Native all-features supports every protocol; the browser suite pins the unsupported TCP/TLS arms.
  'replace ServerAddress::is_supported -> bool with true$',
]
