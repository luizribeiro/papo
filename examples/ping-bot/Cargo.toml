[package]
name = "papo-ping-bot"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "ping-bot"
path = "src/main.rs"

[dependencies]
papo = { path = "../../crates/papo", version = "=0.0.0" }
tokio = { version = "1.53.3", features = ["macros", "rt"] }

[target.'cfg(not(target_os = "wasi"))'.dependencies]
tokio = { version = "1.53.3", features = ["signal"] }

[dev-dependencies]
papo-test-server = { path = "../../crates/papo-test-server", version = "=0.0.0" }

[lints]
workspace = true
