[package]
name = "papo-admin-bot"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "admin-bot"
path = "src/main.rs"

[dependencies]
papo = { path = "../../crates/papo", version = "=0.0.0" }
papo-bot = { path = "../../crates/papo-bot", version = "=0.0.0" }
papo-proto = { path = "../../crates/papo-proto", version = "=0.0.0" }
tokio = { version = "1.53.3", features = ["macros", "rt"] }

[dev-dependencies]
papo-test-server = { path = "../../crates/papo-test-server", version = "=0.0.0" }
tokio = { version = "1.53.3", features = ["time"] }

[lints]
workspace = true
