[package]
name = "papo-graceful-shutdown"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true
publish = false

[[bin]]
name = "graceful-shutdown"
path = "src/main.rs"

[dependencies]
papo = { path = "../../crates/papo", version = "=0.1.0" }
tokio = { version = "1.53.3", features = ["macros", "rt"] }

[target.'cfg(not(target_os = "wasi"))'.dependencies]
tokio = { version = "1.53.3", features = ["signal"] }

[dev-dependencies]
papo-test-server = { path = "../../crates/papo-test-server", version = "=0.1.0" }
tokio = { version = "1.53.3", features = ["time"] }

[lints]
workspace = true
