[waivers]
"base.ping.server-initiated" = "The managed servers expose no deterministic control that emits a server-originated PING on demand."
"base.quit.server-initiated" = "A per-scenario local server shutdown is not exposed by the shared live-server harness."
"ircv3.sasl.external" = "The managed servers do not provision a client certificate fingerprint mapped to an account."
"ircv3.sasl.already-907" = "papo's public API cannot inject a second AUTHENTICATE exchange before registration completes."
"ircv3.sasl.mechs-908" = "papo's public API cannot inject an unsupported AUTHENTICATE mechanism before registration completes."
"draft.account-registration.verify" = "The managed servers expose no mail sink from which a verification code can be obtained."
"core.cap-notify.del" = "The managed servers cannot remove a capability while connected without reloading or replacing the server process."
"core.sasl.reauth" = "papo has no public API for starting a second SASL exchange after registration."
"core.batch.netsplit-netjoin" = "A single local IRC server cannot produce a server-link split or netjoin batch."
"core.tls.sni" = "The local harness has no TLS-terminating observer that can inspect the ClientHello server name."
"draft.chathistory.targets" = "The public history_targets API emits bare RFC3339 bounds, but the live specification and Ergo require timestamp= references."
"base.ctcp.channel-query-private-reply" = "The public automatic CTCP responder handles private queries and exposes no channel-query reply hook."
"base.ctcp.no-ctcp-mode" = "No portable mode identifies CTCP blocking across the managed server profiles."
"base.error.message" = "The managed harness exposes no deterministic server action that emits ERROR before disconnecting one client."
"base.kill.relay" = "KILL requires portable operator provisioning and observation of a server-forced target disconnect."
"base.links.basic" = "Every managed profile runs one standalone IRC server; Ergo returns only end-of-LINKS for that topology, so no link row exists to verify."
"base.message.line-too-long" = "papo bounds outbound lines before transmission, so a live scenario cannot elicit server numeric 417 with an oversized line."
"base.oper.failure" = "The managed operator setup provisions only valid credentials; refusal variants remain outside the current scenario set."
"base.privmsg.empty-text" = "papo rejects empty chat text locally before a server can return numeric 412."
"base.wallops.relay" = "papo has no public WALLOPS action and the behavior requires portable operator setup."
"core.multiclient.fanout" = "Portable same-account fanout needs shared upstream identity support that the managed bouncer profile does not provide."
"core.multiclient.state-sync-on-attach" = "Portable attach replay needs shared upstream identity support that the managed bouncer profile does not provide."
"draft.client-batch.errors" = "papo exposes no public client-batch construction API for malformed or unsupported client batches."
"draft.message-redaction.errors" = "Portable typed redaction refusal coverage is deferred from the current scenario set."
"draft.multiline.errors-limits" = "papo applies multiline limits before transmission, preventing a live server-limit refusal scenario."
"draft.network-icon" = "Only UnrealIRCd exposes the draft network icon token among the managed profiles."
"draft.oper-tag" = "The behavior requires portable operator provisioning and a server that advertises draft/oper-tag."
"draft.webpush" = "The managed profiles have no always-on HTTPS push endpoint configured for WEBPUSH registration."
"ergo.authtoken" = "Ergo authtoken support is disabled in the managed profile."
"ergo.history-legacy" = "papo exposes typed CHATHISTORY requests rather than Ergo's human-oriented HISTORY command."
"ergo.nickserv-chanserv" = "Service-command workflows are outside the typed client API and current local account fixture."
"ergo.relaymsg" = "Portable relay attribution is covered by library integration tests but not exposed by the conformance fixture."
"ergo.sasl-oauthbearer" = "The managed Ergo profile has no OAuth2 or JWT authentication provider configured."
"ergo.whoami" = "papo has no public action for Ergo's post-registration draft/whoami exchange."
"ircv3.account-extban" = "The public mode API does not expose a typed account-extban mask constructor."
"ircv3.message-tags.size-limit-417" = "papo bounds outbound tag sections before transmission, preventing a live server numeric 417 scenario."
