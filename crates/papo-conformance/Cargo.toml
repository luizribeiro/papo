[package]
name = "papo-conformance"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true
publish = false

[dependencies]
libtest-mimic = "0.8.2"
papo = { path = "../papo", version = "=0.0.0", default-features = false, features = ["tls-ring", "websocket"] }
papo-core = { path = "../papo-core", version = "=0.0.0" }
papo-proto = { path = "../papo-proto", version = "=0.0.0" }
papo-test-server = { path = "../papo-test-server", version = "=0.0.0" }
tokio = { version = "1.53.3", features = ["io-util", "rt", "time"] }
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde"] }

[[test]]
name = "live_conformance"
harness = false

[lints]
workspace = true
