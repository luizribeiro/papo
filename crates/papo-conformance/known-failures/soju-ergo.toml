[away_notify]
reason = "soju replaces a downstream client's away text with aggregate AWAY *, which Ergo does not expose as public away state"
kind = "not-implemented"
spec = "https://ircv3.net/specs/extensions/away-notify"
evidence = "downstream C: AWAY :reviewing | soju upstream C: AWAY * | observer S: no AWAY notification"
server_version = "soju 0.11.1 / Ergo 2.19.1"

[channel_modes_and_join_refusals]
reason = "soju stops relaying later channel MODE and message traffic to a newly joined observing network"
kind = "not-implemented"
spec = "https://modern.ircdocs.horse/#mode-message"
evidence = "observer S: JOIN and channel sync complete | later S: no MODE +m, MODE +v, or voiced PRIVMSG before the observer timeout"
server_version = "soju 0.11.1 / Ergo 2.19.1"

[chathistory_errors]
reason = "the specification recommends both INVALID_TARGET for an unavailable target and an empty batch when no content exists"
kind = "spec-ambiguity"
spec = "https://ircv3.net/specs/extensions/chathistory"
evidence = "C: CHATHISTORY LATEST #missing * 10 | S: an empty chathistory batch"
server_version = "soju 0.11.1 / Ergo 2.19.1"

[terminal_history_page]
reason = "soju never marks the final nonempty history page with draft/chathistory-end"
kind = "not-implemented"
spec = "https://ircv3.net/specs/extensions/chathistory"
evidence = "S: 005 MSGREFTYPES=timestamp | S: final five-message chathistory batch has no draft/chathistory-end tag"
server_version = "soju 0.11.1 / Ergo 2.19.1"

[kick_missing_member]
reason = "soju relays its Ergo upstream's 482 after Ergo checks privileges against the absent target instead of returning the applicable 441"
kind = "server-bug"
spec = "https://modern.ircdocs.horse/#kick-message"
evidence = "C: KICK #review absent :not a channel member | S: 482 operator #review"
server_version = "soju 0.11.1 / Ergo 2.19.1"

[draft_chathistory]
reason = "soju never marks the final nonempty history page with draft/chathistory-end"
kind = "not-implemented"
spec = "https://ircv3.net/specs/extensions/chathistory"
evidence = "C: CHATHISTORY LATEST #review * 10 | S: batch contains all three messages but has no draft/chathistory-end tag"
server_version = "soju 0.11.1 / Ergo 2.19.1"

[metadata_subscriptions]
reason = "soju advertises metadata subscriptions but rejects a valid vendor key as KEY_INVALID"
kind = "server-bug"
spec = "https://ircv3.net/specs/extensions/metadata"
evidence = "C: METADATA * SUB example.org/papo-presence | S: FAIL METADATA KEY_INVALID"
server_version = "soju 0.11.1 / Ergo 2.19.1"

[metadata_does_not_cross_nick_handoffs]
reason = "soju advertises metadata subscriptions but rejects a valid vendor key as KEY_INVALID"
kind = "server-bug"
spec = "https://ircv3.net/specs/extensions/metadata"
evidence = "C: METADATA * SUB example.org/papo-identity | S: FAIL METADATA KEY_INVALID"
server_version = "soju 0.11.1 / Ergo 2.19.1"

[monitor]
reason = "soju replaces a downstream client's away text with aggregate AWAY *, which Ergo does not expose as public away state"
kind = "not-implemented"
spec = "https://ircv3.net/specs/extensions/extended-monitor"
evidence = "S: 730 monitored-user | soju upstream C: AWAY * | observer S: no AWAY notification"
server_version = "soju 0.11.1 / Ergo 2.19.1"

[multiple_joins]
reason = "soju does not implement JOIN 0 and rejects it locally as a non-channel target"
kind = "not-implemented"
spec = "https://modern.ircdocs.horse/#join-message"
evidence = "C: JOIN 0 | S: 403 0 :Not a channel name"
server_version = "soju 0.11.1 / Ergo 2.19.1"

[nick_errors]
reason = "soju reports an empty nickname with 432 rather than 431"
kind = "spec-ambiguity"
spec = "https://modern.ircdocs.horse/#nick-message"
evidence = "C: NICK : | S: 432"
server_version = "soju 0.11.1 / Ergo 2.19.1"

[pre_away]
reason = "soju accepts pre-registration AWAY but maps per-client state to aggregate upstream AWAY *, which Ergo leaves publicly present"
kind = "fixture-limit"
spec = "https://ircv3.net/specs/extensions/pre-away"
evidence = "downstream C: AWAY :reviewing during registration | C: WHOIS alice | S: no 301; alice remains present"
server_version = "soju 0.11.1 / Ergo 2.19.1"

[quit]
reason = "soju disconnects the downstream client without quitting its persistent upstream connection"
kind = "fixture-limit"
spec = "https://modern.ircdocs.horse/#quit-message"
evidence = "downstream C: QUIT :conformance complete | upstream S: connection remains attached"
server_version = "soju 0.11.1 / Ergo 2.19.1"

[sasl_plain]
reason = "bouncer authentication replaces the scenario's direct upstream SASL credentials"
kind = "fixture-limit"
spec = "https://ircv3.net/specs/extensions/sasl-3.2"
evidence = "C: PASS bouncer-credentials; AUTHENTICATE PLAIN targets the bouncer session"
server_version = "soju 0.11.1 / Ergo 2.19.1"

[server_queries]
reason = "soju keeps the upstream session attached after downstream QUIT, leaving no WHOWAS record to relay"
kind = "fixture-limit"
spec = "https://modern.ircdocs.horse/#whowas-message"
evidence = "downstream C: QUIT; WHOWAS alice | upstream connection remains attached; S: no 314 row"
server_version = "soju 0.11.1 / Ergo 2.19.1"

[who_and_whois]
reason = "soju's aggregate AWAY * does not expose the downstream client's away state through Ergo WHO and WHOIS"
kind = "not-implemented"
spec = "https://modern.ircdocs.horse/#who-message"
evidence = "downstream C: AWAY :reading WHO reply fields | C: WHO #review | S: 352 row has H rather than G; WHOIS has no 301"
server_version = "soju 0.11.1 / Ergo 2.19.1"

[wildcard_who_stays_separate_from_channel_who]
reason = "soju does not complete a wildcard WHO issued alongside a channel WHO"
kind = "not-implemented"
spec = "https://modern.ircdocs.horse/#who-message"
evidence = "C: WHO *; C: WHO #channel | S: channel WHO rows and end; no wildcard WHO completion"
server_version = "soju 0.11.1 / Ergo 2.19.1"

[targmax_privmsg]
reason = "TARGMAX defines an accepted target count but does not require a refusal or a particular excess-target behavior"
kind = "spec-ambiguity"
spec = "https://modern.ircdocs.horse/#targmax-parameter"
evidence = "S: 005 TARGMAX=...,PRIVMSG:4,... | C: PRIVMSG bob,carol,dave,erin,frank :over the target limit | S: delivered to all five, no 407"
server_version = "soju 0.11.1 / Ergo 2.19.1"

[user_modes]
reason = "Ergo replies 472 rather than 501 for an unknown user mode; soju relays the reply unchanged"
kind = "server-bug"
spec = "https://modern.ircdocs.horse/#mode-message"
evidence = "C: MODE review +? | S: 472 review ?"
server_version = "soju 0.11.1 / Ergo 2.19.1"
