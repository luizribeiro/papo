[account_tag]
reason = "soju does not relay upstream account identity into shared-channel state and message tags"

[away_notify]
reason = "soju does not relay upstream away-notify changes between attached clients"

[batch]
reason = "soju's replay does not expose the upstream history batch expected by this scenario"

[channel_modes_and_join_refusals]
reason = "soju does not relay a later upstream channel MODE change to the observing client"

[chathistory_errors]
reason = "soju returns an empty page for an unavailable target instead of relaying INVALID_TARGET"

[chathistory_paging]
reason = "soju echoes messages without server identifiers usable as history page references"

[kick_missing_member]
reason = "soju relays Ergo's 482 rather than 441 when an operator kicks a user outside the channel"

[draft_chathistory]
reason = "soju's history layer does not expose the earlier upstream message"

[draft_metadata_2]
reason = "soju advertises the upstream metadata limit but applies a smaller local limit"

[metadata_subscriptions]
reason = "soju advertises metadata subscriptions but rejects a valid vendor key as KEY_INVALID"

[channel_metadata]
reason = "soju advertises a one-byte metadata value limit, preventing this channel metadata value"

[extended_join]
reason = "soju omits the upstream real name from relayed extended JOIN messages"

[monitor]
reason = "soju reports a monitored user online but does not relay that user's upstream away change"

[multiple_joins]
reason = "soju treats JOIN zero as a channel name instead of forwarding the leave-all operation upstream"

[nick_change_and_collision]
reason = "soju rejects an upstream nickname collision without preserving the 433 refusal category"

[partially_invalid_join]
reason = "soju does not complete the labelled response for a mixed valid and malformed JOIN"

[quit]
reason = "soju disconnects the downstream client without quitting its persistent upstream connection"

[sasl_plain]
reason = "bouncer authentication replaces the scenario's direct upstream SASL credentials"

[sasl_protocol_errors]
reason = "soju treats post-registration AUTHENTICATE as a fatal bouncer login failure"

[setname]
reason = "soju replaces the upstream real name with the nickname in relayed SETNAME state"

[who_and_whois]
reason = "soju omits a shared-channel upstream user from the downstream WHO result"

[whox]
reason = "soju replaces the configured upstream real name with the nickname in WHOX replies"
