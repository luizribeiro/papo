[away_private_message]
reason = "Solanum's away numeric completes the direct message before papo captures echo metadata for Sent"
kind = "server-bug"
spec = "https://ircv3.net/specs/extensions/labeled-response"
evidence = "C: @label=... PRIVMSG away-user :the review can wait | S: @label=... 301 away-user ...; unlabeled echo"
server_version = "0-unstable-2026-09-13"

[channel_list]
reason = "Solanum does not label the LIST terminator, so the labelled request cannot complete"

[channel_mode_exceptions]
reason = "Solanum labels the first exception-list row but not its terminator, completing the request early"
