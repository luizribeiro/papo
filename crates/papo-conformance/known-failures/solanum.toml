[away_private_message]
reason = "Solanum's away numeric completes the direct message before papo captures echo metadata for Sent"
kind = "server-bug"
spec = "https://ircv3.net/specs/extensions/labeled-response"
evidence = "C: @label=... PRIVMSG away-user :the review can wait | S: @label=... 301 away-user ...; unlabeled echo"
server_version = "0-unstable-2026-09-13"

[channel_list]
reason = "Solanum does not label the LIST terminator, so the labelled request cannot complete"
kind = "server-bug"
spec = "https://ircv3.net/specs/extensions/labeled-response"
evidence = "C: @label=... LIST | S: labeled 322 rows followed by an unlabeled 323 terminator"
server_version = "0-unstable-2026-09-13"

[channel_mode_refusals]
reason = "Solanum acknowledges a nonnumeric channel limit without returning 696"
kind = "server-bug"
spec = "https://modern.ircdocs.horse/#mode-message"
evidence = "C: MODE #review +l not-a-limit | S: ACK, with no 696"
server_version = "0-unstable-2026-09-13"

[direct_messages]
reason = "Solanum drops the client-only channel-context tag while relaying a private message"
kind = "server-bug"
spec = "https://ircv3.net/specs/extensions/message-tags"
evidence = "C: @+channel-context=#review PRIVMSG bob :thread reply | S: PRIVMSG without +channel-context"
server_version = "0-unstable-2026-09-13"

[elist_filters]
reason = "Solanum does not label the filtered LIST terminator, so the labelled request cannot complete"
kind = "server-bug"
spec = "https://ircv3.net/specs/extensions/labeled-response"
evidence = "C: @label=... LIST #review,>1,<3,C<10,T<10 | S: unlabeled 323 terminator"
server_version = "0-unstable-2026-09-13"

[invite_rules]
reason = "Solanum keeps a channel ban effective after the banned user receives an invitation"
kind = "spec-ambiguity"
spec = "https://modern.ircdocs.horse/#invite-message"
evidence = "C: INVITE banned-user #review; JOIN #review | S: 474 #review"
server_version = "0-unstable-2026-09-13"

[kick_rules]
reason = "Solanum applies a multi-target KICK only to the first target and uses that target as the default comment"
kind = "server-bug"
spec = "https://modern.ircdocs.horse/#kick-message"
evidence = "C: KICK #review first,second | S: KICK #review first :first"
server_version = "0-unstable-2026-09-13"

