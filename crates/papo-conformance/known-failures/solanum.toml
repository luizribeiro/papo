[direct_messages]
reason = "Solanum drops the client-only channel-context tag while relaying a private message"

[elist_filters]
reason = "Solanum does not label the filtered LIST terminator, so the labelled request cannot complete"

[invite_rules]
reason = "Solanum keeps a channel ban effective after the banned user receives an invitation"
