[client_batch_errors]
reason = "Ergo reports generic INVALID_PARAMS for unknown and unopened client batches rather than UNKNOWN_TYPE and INVALID_REFTAG"
kind = "server-bug"
spec = "https://ircv3.net/specs/extensions/client-batch"
evidence = "C: BATCH +papo/unknown; BATCH -missing | S: FAIL BATCH INVALID_PARAMS for both requests"
server_version = "2.19.1"

[draft_channel_rename]
reason = "Ergo rejects renaming channels that have persistent history"
kind = "fixture-limit"
spec = "https://ircv3.net/specs/extensions/channel-rename"
evidence = "C: RENAME #old #new :the project moved | S: FAIL RENAME CANNOT_RENAME :Persistent channels cannot be renamed"
server_version = "2.19.1"

[channel_rename_error]
reason = "Ergo rejects renaming persistent-history channels before checking destination collisions"
kind = "spec-ambiguity"
spec = "https://ircv3.net/specs/extensions/channel-rename"
evidence = "C: RENAME #old #occupied :collision | S: FAIL RENAME CANNOT_RENAME"
server_version = "2.19.1"

[kick_missing_member]
reason = "Ergo checks privileges against the absent target and returns 482 to a channel operator instead of the applicable 441"
kind = "server-bug"
spec = "https://modern.ircdocs.horse/#kick-message"
evidence = "C: KICK #review absent :not a channel member | S: 482 operator #review"
server_version = "2.19.1"

[persistence]
reason = "Ergo's always-on account profile keeps persistence effective after accepting an OFF preference"
kind = "fixture-limit"
spec = "https://ircv3.net/specs/extensions/persistence"
evidence = "C: PERSISTENCE SET OFF | S: PERSISTENCE STATUS OFF ON"
server_version = "2.19.1"

[reconnect_follows_channel_rename]
reason = "Ergo rejects renaming channels that have persistent history before reconnect can be tested"
kind = "fixture-limit"
spec = "https://ircv3.net/specs/extensions/channel-rename"
evidence = "C: RENAME #old #new :archive the project | S: FAIL RENAME CANNOT_RENAME :Persistent channels cannot be renamed"
server_version = "2.19.1"

[targmax_privmsg]
reason = "Ergo silently drops the target beyond its advertised TARGMAX PRIVMSG limit instead of returning 407"
kind = "spec-ambiguity"
spec = "https://modern.ircdocs.horse/#targmax-parameter"
evidence = "S: 005 TARGMAX=...,PRIVMSG:4,... | C: PRIVMSG bob,carol,dave,erin,frank :over the target limit | S: delivered to bob..erin, nothing to frank, no 407"
server_version = "2.19.1"

[user_modes]
reason = "Ergo reports an unknown user mode with channel-mode numeric 472 rather than 501"
kind = "server-bug"
spec = "https://modern.ircdocs.horse/#mode-message"
evidence = "C: MODE review +? | S: 472 review ?"
server_version = "2.19.1"
