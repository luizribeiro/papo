[client_batch_errors]
reason = "Ergo reports generic INVALID_PARAMS for an unknown client-batch type rather than UNKNOWN_TYPE"
kind = "server-bug"
spec = "https://ircv3.net/specs/extensions/client-batch"
evidence = "C: BATCH +papo-unknown papo.example/unknown #papo-missing | S: FAIL BATCH INVALID_PARAMS :Corrupt BATCH"
server_version = "2.19.1"

[kick_missing_member]
reason = "Ergo checks privileges against the absent target and returns 482 to a channel operator instead of the applicable 441"
kind = "server-bug"
spec = "https://modern.ircdocs.horse/#kick-message"
evidence = "C: KICK #review absent :not a channel member | S: 482 operator #review"
server_version = "2.19.1"

[standard_replies]
reason = "Ergo accepts a SETNAME longer than its configured 150-byte realname limit instead of returning INVALID_REALNAME"
kind = "server-bug"
spec = "https://ircv3.net/specs/extensions/setname"
evidence = "C: SETNAME :<151-byte realname> | S: SETNAME echo, with no FAIL SETNAME INVALID_REALNAME"
server_version = "2.19.1"

[targmax_privmsg]
reason = "Ergo silently drops the target beyond its advertised TARGMAX PRIVMSG limit instead of returning 407"
kind = "spec-ambiguity"
spec = "https://modern.ircdocs.horse/#targmax-parameter"
evidence = "S: 005 TARGMAX=...,PRIVMSG:4,... | C: PRIVMSG bob,carol,dave,erin,frank :over the target limit | S: delivered to bob..erin, nothing to frank, no 407"
server_version = "2.19.1"

[user_modes]
reason = "Ergo reports an unknown user mode with channel-mode numeric 472 rather than 501"
kind = "server-bug"
spec = "https://modern.ircdocs.horse/#mode-message"
evidence = "C: MODE review +? | S: 472 review ?"
server_version = "2.19.1"
