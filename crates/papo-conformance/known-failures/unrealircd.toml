[standard_replies]
reason = "UnrealIRCd advertises standard-replies but does not reject this invalid real name with FAIL"
kind = "server-bug"
spec = "https://ircv3.net/specs/extensions/setname"
evidence = "C: SETNAME : | S: no FAIL SETNAME INVALID_REALNAME"
server_version = "6.2.7"

[status_message]
reason = "UnrealIRCd advertises STATUSMSG but does not deliver a message addressed to voiced members"
kind = "server-bug"
spec = "https://modern.ircdocs.horse/#statusmsg-parameter"
evidence = "S: 005 STATUSMSG=@+ | C: PRIVMSG +#review :operators only | S: no delivery"
server_version = "6.2.7"

[client_batch_errors]
reason = "UnrealIRCd reports MULTILINE_INVALID rather than INVALID_REFTAG when closing an unopened client batch"
kind = "server-bug"
spec = "https://ircv3.net/specs/extensions/client-batch"
evidence = "C: BATCH -missing | S: FAIL BATCH MULTILINE_INVALID"
server_version = "6.2.7"

[direct_messages]
reason = "UnrealIRCd drops the client-only channel-context tag when its sender is no longer in that channel"
kind = "server-bug"
spec = "https://ircv3.net/specs/extensions/message-tags"
evidence = "C: @+channel-context=#review PRIVMSG bob :context after part | S: PRIVMSG without +channel-context"
server_version = "6.2.7"
