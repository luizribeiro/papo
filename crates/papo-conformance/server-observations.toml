[ergo-default.history-end]
finding = "The final nonempty five-message page carries draft/chathistory-end."
evidence = "S: @batch=reply;draft/chathistory-end BATCH +history chathistory #review"
server_version = "2.19.1"

[ergo-default.connect-line-length]
finding = "Every observed CAP LS and welcome-burst line fits the wire limits."
evidence = "longest S: 501 bytes CAP (0 tag section + 501 line)"
server_version = "2.19.1"

[ergo-default.labeled-response]
finding = "The server advertises labeled-response."
evidence = "S: CAP * LS includes labeled-response"
server_version = "2.19.1"

[ergo-default.statusmsg-reference-audience]
finding = "Client-only reply and reaction tags do not inherit the referenced status-message audience; delivery follows the bare channel target."
evidence = "C: @+draft/reply=<ops-msgid> PRIVMSG #review; @+draft/react=📣;+draft/reply=<ops-msgid> TAGMSG #review | S: both reach non-operators"
server_version = "2.19.1"

[ergo-default.multidevice-ctcp-replies]
finding = "A private CTCP query reaches all three attached sessions, and each session sends one automatic reply."
evidence = "C: PRIVMSG account :VERSION query | attached A/B/C S: query | sender S: three VERSION replies"
server_version = "2.19.1"

