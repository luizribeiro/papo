evidence = "longest S: 430 bytes CAP (0 tag section + 430 line)"
server_version = "soju 0.11.1 / Ergo 2.19.1"

[soju-ergo.labeled-response]
finding = "The bouncer advertises labeled-response; no managed profile lacks it."
evidence = "S: CAP * LS includes labeled-response"
server_version = "soju 0.11.1 / Ergo 2.19.1"

[soju-ergo.multidevice-away-state]
finding = "AWAY applies only to the initiating downstream session while another session remains attached; the sibling and upstream channel peers continue to see the account as available."
evidence = "downstream A C: AWAY :reviewing | downstream B: no AWAY, state available | upstream peer: no AWAY, state available"
server_version = "soju 0.11.1 / Ergo 2.19.1"

[soju-ergo.multidevice-nickname-state]
finding = "soju accepts a downstream nickname change and broadcasts it to every attached session, while direct Ergo sessions reject the same account rename under the fixture's strict account-name enforcement."
evidence = "soju downstream A C: NICK mobile-alice | downstream A/B/C S: NICK mobile-alice; direct Ergo S: 400 You must use your account name as your nickname"
server_version = "soju 0.11.1 / Ergo 2.19.1"

[soju-ergo.multidevice-ctcp-replies]
finding = "A private CTCP query reaches all three attached sessions, and each session sends one automatic reply."
evidence = "C: PRIVMSG account :VERSION query | attached A/B/C S: query | sender S: three VERSION replies"
server_version = "soju 0.11.1 / Ergo 2.19.1"

[soju-ergo.multidevice-history-authorship]
finding = "History contains messages sent by a sibling session exactly once, but without the account identity needed to classify them as own messages; direct Ergo classifies the same history entries as own."
evidence = "A C: PRIVMSG #review :offline update | reattached B history: Message, not OwnMessage; direct Ergo history: OwnMessage"
server_version = "soju 0.11.1 / Ergo 2.19.1"

