[soju-ergo.history-end]
finding = "The terminal signal is not observable because returned messages lack the advertised msgid reference needed for the next page."
evidence = "S: 005 MSGREFTYPES=msgid | S: history PRIVMSG lines without msgid"
server_version = "soju 0.11.1 / Ergo 2.19.1"

[soju-ergo.connect-line-length]
