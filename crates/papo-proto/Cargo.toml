[package]
name = "papo-proto"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true
publish = true
description = "Internal crate of papo; use papo (no API stability guarantees)"
readme = "../../README.md"
keywords = ["irc", "ircv3", "protocol", "parser"]
categories = ["network-programming", "parser-implementations"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
precis = ["dep:precis-profiles"]

[lints]
workspace = true

[dependencies]
precis-profiles = { version = "0.2.0", optional = true }
zeroize = { version = "1.9.1", default-features = false, features = ["alloc"] }

[dev-dependencies]
proptest = { version = "1.9", default-features = false, features = ["std"] }
serde_json = "1.0"
