[package]
name = "papo"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true
publish.workspace = true

[features]
default = ["tls-ring"]
websocket = ["dep:futures-util", "dep:tokio-tungstenite"]
tls-aws-lc = [
  "dep:rustls",
  "dep:rustls-platform-verifier",
  "dep:tokio-rustls",
  "rustls/aws-lc-rs",
]
tls-ring = [
  "dep:rustls",
  "dep:rustls-platform-verifier",
  "dep:tokio-rustls",
  "rustls/ring",
]

[dependencies]
futures-util = { version = "0.3.34", default-features = false, features = ["sink"], optional = true }
getrandom = "0.4.3"
papo-core = { path = "../papo-core", version = "=0.0.0" }
papo-proto = { path = "../papo-proto", version = "=0.0.0" }
# TLS 1.2 remains enabled for IRC interoperability; rustls offers only secure 1.2 suites.
rustls = { version = "0.23.46", default-features = false, features = ["std", "tls12"], optional = true }
rustls-platform-verifier = { version = "0.7.1", optional = true }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["tls12"], optional = true }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"], optional = true }

[dev-dependencies]
papo-test-server = { path = "../papo-test-server", version = "=0.0.0" }
tokio = { version = "1.53.3", features = ["test-util"] }

[lints]
workspace = true
