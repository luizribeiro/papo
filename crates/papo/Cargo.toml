[package]
name = "papo"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true
publish.workspace = true

[features]
default = ["tls-ring"]
tls-aws-lc = [
  "dep:rustls",
  "dep:rustls-platform-verifier",
  "dep:tokio-rustls",
  "rustls/aws-lc-rs",
]
tls-ring = [
  "dep:rustls",
  "dep:rustls-platform-verifier",
  "dep:tokio-rustls",
  "rustls/ring",
]

[dependencies]
papo-core = { path = "../papo-core", version = "=0.0.0" }
papo-proto = { path = "../papo-proto", version = "=0.0.0" }
rustls = { version = "0.23.46", default-features = false, features = ["std", "tls12"], optional = true }
rustls-platform-verifier = { version = "0.7.1", optional = true }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["io-util", "macros", "net", "rt", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["tls12"], optional = true }

[dev-dependencies]
papo-test-server = { path = "../papo-test-server", version = "=0.0.0" }

[lints]
workspace = true
