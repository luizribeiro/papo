[package]
name = "papo-bot"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true
publish = false
description = "Bot routing and command helpers for the papo IRC client"
readme = "../../README.md"
keywords = ["irc", "ircv3", "bot", "tokio"]
categories = ["network-programming", "asynchronous"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
papo = { path = "../papo", version = "=0.1.0", default-features = false }
web-time = "1.1.0"

[dev-dependencies]
futures-io = "0.3.34"
papo-testing = { path = "../papo-testing", version = "=0.1.0" }
tokio = { version = "1.53.3", features = ["macros", "rt"] }

[lints]
workspace = true
