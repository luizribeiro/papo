[package]
name = "papo-core"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true
publish = true
description = "Internal crate of papo; use papo (no API stability guarantees)"
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
precis = ["papo-proto/precis"]
unstable = []

[dependencies]
base64 = { version = "0.22.1", default-features = false, features = ["alloc"] }
hmac = { version = "0.12.1", default-features = false }
papo-proto = { path = "../papo-proto", version = "=0.1.0" }
pbkdf2 = { version = "0.12.2", default-features = false, features = ["hmac"] }
sha2 = { version = "0.10.9", default-features = false }
web-time = "1.1.0"
zeroize = { version = "1.9.1", default-features = false, features = ["alloc"] }

[dev-dependencies]
papo-test-server = { path = "../papo-test-server", version = "=0.1.0" }
proptest = { version = "1.9", default-features = false, features = ["std"] }

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
proptest-state-machine = "0.9.0"

[[test]]
name = "credential_markers"
required-features = ["unstable"]

[lints]
workspace = true
