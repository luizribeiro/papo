[package]
name = "papo-core"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true
publish = true
description = "Deterministic sans-I/O IRC client behavior for papo"
readme = "../../README.md"
keywords = ["irc", "ircv3", "client", "sans-io"]
categories = ["network-programming", "asynchronous"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
precis = ["papo-proto/precis"]
unstable = []

[dependencies]
base64 = { version = "0.22.1", default-features = false, features = ["alloc"] }
hmac = { version = "0.12.1", default-features = false }
papo-proto = { path = "../papo-proto", version = "=0.1.0" }
pbkdf2 = { version = "0.12.2", default-features = false, features = ["hmac"] }
sha2 = { version = "0.10.9", default-features = false }
web-time = "1.1.0"
zeroize = { version = "1.9.1", default-features = false, features = ["alloc"] }

[dev-dependencies]
papo-test-server = { path = "../papo-test-server", version = "=0.1.0" }

[lints]
workspace = true
