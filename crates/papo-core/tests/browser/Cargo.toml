[package]
name = "papo-core-browser-tests"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[profile.browser-size]
inherits = "release"
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
driver = ["dep:papo"]

[dependencies]
js-sys = "0.3.106"
papo = { path = "../../../papo", optional = true }
papo-core = { path = "../.." }
papo-proto = { path = "../../../papo-proto" }
tokio = { version = "1.53.3", features = ["io-util", "sync"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = ["BinaryType", "CloseEvent", "ErrorEvent", "Event", "MessageEvent", "WebSocket"] }
web-time = "1.1.0"

[dev-dependencies]
wasm-bindgen-test = "=0.3.79"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = "warn"
