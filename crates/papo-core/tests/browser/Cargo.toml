[package]
name = "papo-core-browser-tests"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
papo-core = { path = "../.." }
papo-proto = { path = "../../../papo-proto" }
wasm-bindgen = "=0.2.129"
web-time = "1.1.0"

[dev-dependencies]
wasm-bindgen-test = "=0.3.79"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = "warn"
