[workspace]
resolver = "3"
members = [
  "crates/papo-proto",
  "crates/papo-core",
  "crates/papo-test-server",
  "crates/papo-testing",
  "crates/papo",
  "crates/papo-bot",
  "crates/papo-conformance",
  "examples/parse",
  "examples/ping-bot",
  "examples/lurker",
  "examples/admin-bot",
  "examples/react-bot",
  "examples/graceful-shutdown",
  "examples/catchup",
  "examples/create-account",
  "examples/browser-worker",
  "examples/sts-store",
]
exclude = ["fuzz"]

[workspace.package]
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/luizribeiro/papo"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
must_use_candidate = "warn"
pedantic = "warn"
return_self_not_must_use = "warn"
